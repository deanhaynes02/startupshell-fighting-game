<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Showdown</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #fff; font: 15px system-ui, sans-serif; }
    #unity-container {
      position: fixed; inset: 0; display: grid; place-items: center; background: #111;
    }
    #unity-canvas {
      display: block; width: min(100vw, 100dvh * 16 / 9);
      height: min(100dvh, 100vw * 9 / 16); background: #111;
    }
    #unity-fullscreen-button {
      position: absolute; right: max(16px, env(safe-area-inset-right)); top: 16px;
      padding: 8px 14px; border: 1px solid #aaa; border-radius: 6px;
      background: #171717e8; color: #fff; font: inherit; cursor: pointer;
    }
    #unity-container:fullscreen #unity-fullscreen-button { display: none; }
    #unity-loading-bar { position: absolute; text-align: center; }
    #unity-loading-bar progress { width: min(320px, 75vw); accent-color: #ec6c21; }
    #unity-warning { position: absolute; bottom: 16px; max-width: 85%; background: #171717; }
  </style>
</head>
<body>
  <main id="unity-container" aria-label="Startup Showdown">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1" aria-label="Game"></canvas>
    <div id="unity-loading-bar" role="status">
      <div id="unity-loading-label">Loading Startup Showdown</div>
      <progress id="unity-progress" value="0" max="1" aria-labelledby="unity-loading-label"></progress>
    </div>
    <div id="unity-warning" role="alert"></div>
    <button id="unity-fullscreen-button" type="button">Fullscreen</button>
  </main>
  <script src="Build/Web.loader.js"></script>
  <script>
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("unity-loading-bar");
    const warning = document.getElementById("unity-warning");
    const fullscreen = document.getElementById("unity-fullscreen-button");

    fullscreen.addEventListener("click", async () => {
      try {
        await container.requestFullscreen();
        canvas.focus();
      } catch {
        warning.textContent = "Fullscreen is unavailable in this window.";
      }
    });
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) canvas.focus();
    });

    const config = {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Dean",
      productName: "Startup Showdown",
      productVersion: "0.1",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner(message, type) {
        if (type === "error") warning.textContent = message;
        else console.warn(message);
      },
    };
    createUnityInstance(canvas, config, progress => {
      document.getElementById("unity-progress").value = progress;
    }).then(() => {
      loading.style.display = "none";
    }).catch(error => {
      loading.style.display = "none";
      warning.textContent = String(error);
    });
  </script>
</body>
</html>
